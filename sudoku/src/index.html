<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Sudoku</title>
<style>
/*{{CSS}}*/
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-undo"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></g>
    <g id="i-erase"><path d="M20 20H9l-5-5a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-7 7"/><path d="m8 9 7 7"/></g>
    <g id="i-pencil"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    <g id="i-bulb"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></g>
    <g id="i-pause"><path d="M8 5v14M16 5v14"/></g>
    <g id="i-play"><path d="M7 4v16l13-8Z"/></g>
    <g id="i-stats"><path d="M5 20V10M11 20V4M17 20v-7M22 20H2"/></g>
    <g id="i-book"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/></g>
    <g id="i-gear"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></g>
    <g id="i-close"><path d="M6 6l12 12M18 6 6 18"/></g>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <h1>Sudoku</h1>
    <nav>
      <button id="newgame-top" class="pill">New Game</button>
      <button id="btn-stats" class="icon-btn" aria-label="Statistics"><svg viewBox="0 0 24 24"><use href="#i-stats"/></svg></button>
      <button id="btn-guide" class="icon-btn" aria-label="Technique guide"><svg viewBox="0 0 24 24"><use href="#i-book"/></svg></button>
      <button id="btn-settings" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
    </nav>
  </header>

  <main class="game">
    <section class="board-col">
      <div class="info">
        <div>Difficulty: <b id="lvl">-</b></div>
        <div id="mist-wrap">Mistakes: <b id="mist">0/3</b></div>
        <div class="time"><b id="time">00:00</b>
          <button id="btn-pause" class="icon-btn small" aria-label="Pause"><svg viewBox="0 0 24 24"><use id="pause-ico" href="#i-pause"/></svg></button>
        </div>
      </div>
      <div class="board-wrap">
        <div id="board" class="board"></div>
        <button id="paused" class="paused" hidden aria-label="Resume"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg><span>Paused</span></button>
      </div>
    </section>

    <section class="side">
      <div id="hint" class="hint" hidden>
        <div class="hint-head">
          <h3 id="hint-title"></h3>
          <span id="hint-dots" class="dots"></span>
          <button id="hint-guide" class="link">What is this?</button>
          <button id="hint-close" class="icon-btn small" aria-label="Close hint"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
        </div>
        <p id="hint-body"></p>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="actions">
        <button id="btn-undo" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg></span>Undo</button>
        <button id="btn-erase" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-erase"/></svg></span>Erase</button>
        <button id="btn-notes" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-pencil"/></svg><span id="notes-badge" class="badge">OFF</span></span>Notes</button>
        <button id="btn-hint" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-bulb"/></svg></span>Hint</button>
      </div>
      <div id="pad" class="pad"></div>
      <button id="newgame" class="primary desktop-only">New Game</button>
    </section>
  </main>

</div>

<div id="modal" class="modal" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>

<script>
/*{{JS}}*/
</script>
</body>
</html>
