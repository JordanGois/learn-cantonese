<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Sudoku</title>
<style>
:root {
  --bg: #ffffff; --text: #344861; --muted: #6e7c8c; --card: #f1f4f8;
  --line: #bfc6d4; --line-strong: #344861; --cell: #ffffff;
  --given: #344861; --user: #325aaf; --wrong: #e55c6c; --wrong-bg: #f7cfd6;
  --sel: #bbdefb; --peer: #e2ebf3; --same: #c3d7ea;
  --btn: #eaeef4; --accent: #5a7bc0; --pad: #325aaf; --ripple: #9cc4f5;
  --hint-region: #fff1b8; --hint-pat: #bfe8c6; --hint-target: #ffd3d3; --fail: #e55c6c;
  /* board edge: fit the width, and leave room below for the controls on a phone */
  --board: min(calc(100vw - 20px), calc(100dvh - 292px), 540px);
}
html[data-theme="dark"] {
  --bg: #101820; --text: #d5deea; --muted: #8a98aa; --card: #1a2531;
  --line: #2c3a4c; --line-strong: #8090a6; --cell: #16202b;
  --given: #e3eaf3; --user: #73a7ff; --wrong: #ff6b7d; --wrong-bg: #4d2731;
  --sel: #2a5591; --peer: #1d2a39; --same: #2c4567;
  --btn: #1f2b39; --accent: #4f78cc; --pad: #86b4ff; --ripple: #3f73bd;
  --hint-region: #4a431c; --hint-pat: #1f4d2c; --hint-target: #5a2a2f; --fail: #ff6b7d;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overscroll-behavior: none;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
[hidden] { display: none !important; }

#app { position: relative; max-width: 960px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) 10px calc(8px + env(safe-area-inset-bottom)); }
.top { display: flex; align-items: center; justify-content: space-between; height: 44px; }
.top h1 { margin: 0 8px 0 0; font-size: 20px; font-weight: 700; color: var(--given); letter-spacing: .2px; }
.top nav { display: flex; align-items: center; gap: 2px; }
.icon-btn { width: 40px; height: 40px; border: 0; background: none; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: var(--text); }
.icon-btn.small { width: 28px; height: 28px; } .icon-btn.small svg { width: 18px; height: 18px; }
.icon-btn:active { background: var(--btn); }
.pill { border: 0; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600; padding: 7px 12px; border-radius: 16px; margin-right: 4px; }
.primary { width: 100%; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; padding: 13px; }
.primary:active, .pill:active { filter: brightness(.92); }
.secondary { width: 100%; border: 0; border-radius: 10px; background: var(--btn); font-size: 16px; font-weight: 600; padding: 12px; }
.desktop-only { display: none; }
@media (max-width: 350px) { .top h1 { font-size: 18px; } .pill { font-size: 13px; padding: 6px 10px; } .top .icon-btn { width: 34px; } }

.game { display: flex; flex-direction: column; gap: 8px; }
.board-col { width: var(--board); margin: 0 auto; }
.info { display: flex; justify-content: space-between; align-items: center; height: 28px; font-size: 13px; color: var(--muted); }
.info b { color: var(--text); font-weight: 600; }
.info .time { display: flex; align-items: center; gap: 2px; font-variant-numeric: tabular-nums; }
#mist-wrap.fail, #mist-wrap.fail b { color: var(--fail); }

.board-wrap { position: relative; }
.board { width: var(--board); height: var(--board); display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr);
  border: 2px solid var(--line-strong); background: var(--cell); }
.cell { position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; background: var(--cell);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: calc(var(--board) / 9 * .62); line-height: 1; color: var(--given); }
.cell.bx { border-right: 2px solid var(--line-strong); } .cell.by { border-bottom: 2px solid var(--line-strong); }
.cell.ex { border-right: 0; } .cell.ey { border-bottom: 0; }
.cell.user { color: var(--user); } .cell.wrong { color: var(--wrong); }
/* later rules win: hint colours sit on top of selection colours */
.cell.peer { background: var(--peer); } .cell.same { background: var(--same); } .cell.conflict { background: var(--wrong-bg); }
.cell.sel { background: var(--sel); }
.cell.hr { background: var(--hint-region); } .cell.hp { background: var(--hint-pat); } .cell.ht { background: var(--hint-target); }
.notes { position: absolute; inset: 1px; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr);
  font-size: calc(var(--board) / 9 * .27); color: var(--muted); pointer-events: none; }
.notes i { font-style: normal; display: flex; align-items: center; justify-content: center; visibility: hidden; }
.notes i.on { visibility: visible; }
.notes i.same { color: var(--user); font-weight: 800; }
.notes i.strike { visibility: visible; color: var(--wrong); font-weight: 800; text-decoration: line-through; }
.val { pointer-events: none; }

@keyframes pop { 0% { transform: scale(.5); opacity: .2; } 60% { transform: scale(1.18); } 100% { transform: scale(1); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12%); } 40% { transform: translateX(12%); } 60% { transform: translateX(-8%); } 80% { transform: translateX(8%); } }
/* only the peak is keyed, so each cell fades from and back to whatever highlight it already has */
@keyframes ripple { 35% { background: var(--ripple); } }
@keyframes bump { 35% { transform: scale(1.25); } }
.cell.pop .val { animation: pop .18s ease-out; }
.cell.shake .val { animation: shake .32s ease-in-out; }
.cell.ripple { animation: ripple .55s ease-out; animation-delay: var(--d, 0ms); }
.cell.ripple .val { animation: bump .55s ease-out; animation-delay: var(--d, 0ms); }
@media (prefers-reduced-motion: reduce) { .cell.pop .val, .cell.shake .val, .cell.ripple, .cell.ripple .val { animation: none; } }

.paused { position: absolute; inset: 2px; border: 0; background: var(--card); color: var(--text); display: flex; flex-direction: column; gap: 8px; align-items: center; justify-content: center; font-size: 15px; }
.paused svg { width: 56px; height: 56px; fill: var(--accent); stroke: var(--accent); }

.side { width: var(--board); margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
.status { height: 22px; font-size: 13px; line-height: 22px; text-align: center; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.status.lock { color: var(--accent); font-weight: 600; } .status.warn { color: var(--fail); font-weight: 600; }
.actions { display: grid; grid-template-columns: repeat(4, 1fr); }
.act { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 12px; color: var(--muted); padding: 0; }
.act .ico { position: relative; width: 48px; height: 48px; border-radius: 50%; background: var(--btn); color: var(--text); display: flex; align-items: center; justify-content: center; }
.act:active .ico { filter: brightness(.92); }
.act.on .ico { background: var(--accent); color: #fff; }
.badge { position: absolute; top: -5px; right: -12px; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 9px; background: var(--muted); color: #fff; border: 2px solid var(--bg); }
.act.on .badge { background: var(--user); }
.pad { display: grid; grid-template-columns: repeat(9, 1fr); gap: 2px; touch-action: none; }
.num { border: 0; background: none; border-radius: 8px; color: var(--pad); display: flex; flex-direction: column; align-items: center; padding: 4px 0 3px;
  font-size: clamp(26px, 8.4vw, 38px); line-height: 1.05; }
.num small { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.num:active { background: var(--btn); }
.num.done { opacity: .22; }
.num.locked { background: var(--accent); color: #fff; } .num.locked small { color: #fff; }

/* Hint card sits over the title bar and info row, so the board never moves and stays fully visible. */
.hint { position: absolute; left: 10px; right: 10px; top: calc(env(safe-area-inset-top) + 2px); min-height: 72px; z-index: 5;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 8px 8px 12px; box-shadow: 0 4px 14px rgba(20, 35, 60, .18); }
.hint-head { display: flex; align-items: center; gap: 8px; }
.hint h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--given); }
.hint p { margin: 2px 0 0; font-size: 13px; line-height: 1.35; }
.dots { display: inline-flex; gap: 3px; } .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--accent); }
.link { border: 0; background: none; color: var(--accent); font-size: 12px; text-decoration: underline; padding: 4px 0; white-space: nowrap; }

.modal { position: fixed; inset: 0; z-index: 10; background: rgba(10, 20, 35, .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 520px; max-height: 90dvh; overflow: auto; -webkit-overflow-scrolling: touch; background: var(--bg); border-radius: 16px 16px 0 0;
  padding: 14px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sheet h2 { margin: 0; font-size: 19px; color: var(--given); }
.sheet .gap { height: 10px; }
.levels { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
.level { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: var(--card); border-radius: 10px; padding: 9px 12px; text-align: left; }
.level:active { filter: brightness(.94); }
.level.current { outline: 2px solid var(--accent); }
.level .n { width: 26px; height: 26px; border-radius: 50%; background: var(--btn); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--muted); flex: none; }
.level .name { font-weight: 650; font-size: 16px; color: var(--given); }
.level .sub { font-size: 12px; color: var(--muted); }
.level .avg { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.result { text-align: center; padding: 6px 0 2px; }
.result .big { font-size: 40px; font-weight: 700; color: var(--given); font-variant-numeric: tabular-nums; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 12px; color: #fff; background: #3fa35c; }
.tag.fail { background: var(--fail); } .tag.assisted { background: #c08a2b; }
.facts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
.fact { background: var(--card); border-radius: 10px; padding: 8px 10px; font-size: 12px; color: var(--muted); }
.fact b { display: block; font-size: 17px; color: var(--given); font-variant-numeric: tabular-nums; }
.note-line { font-size: 13px; color: var(--muted); margin: 6px 0 12px; line-height: 1.4; }
table.stats { width: 100%; border-collapse: collapse; font-size: 12px; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
table.stats th, table.stats td { padding: 6px 3px; text-align: right; border-bottom: 1px solid var(--line); }
table.stats th { color: var(--muted); font-weight: 600; } table.stats th:first-child, table.stats td:first-child { text-align: left; }
.setting { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.seg { display: inline-flex; background: var(--btn); border-radius: 9px; padding: 2px; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: 14px; }
.seg button.on { background: var(--bg); font-weight: 650; box-shadow: 0 1px 3px rgba(0, 0, 0, .18); }
.switch { width: 48px; height: 28px; border-radius: 14px; border: 0; background: var(--line); position: relative; transition: background .15s; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch.on { background: var(--accent); } .switch.on::after { transform: translateX(20px); }
.guide-group { font-size: 12px; font-weight: 700; color: var(--muted); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: .4px; }
.guide-item { display: block; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 9px; padding: 10px 12px; margin-bottom: 5px; font-size: 15px; font-weight: 600; color: var(--given); }
.mini { --board: min(calc(100vw - 48px), 360px); margin: 8px auto 6px; width: var(--board); }
.caption { font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 10px; }
.guide-text { font-size: 15px; line-height: 1.5; margin: 0 0 14px; user-select: text; -webkit-user-select: text; }

/* Wide screens: board on the left, controls on the right, like sudoku.com's desktop layout. */
@media (min-width: 860px) and (min-height: 560px) {
  :root { --board: min(540px, calc(100dvh - 130px)); }
  .top { height: 56px; }
  .game { flex-direction: row; justify-content: center; align-items: flex-start; gap: 32px; }
  .board-col, .side { margin: 0; } .side { width: 300px; padding-top: 28px; gap: 14px; }
  .pad { grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .num { background: var(--btn); font-size: 34px; padding: 12px 0 8px; }
  .desktop-only { display: block; } #newgame-top { display: none; }
  .hint { position: static; box-shadow: none; }
  .modal { align-items: center; } .sheet { border-radius: 16px; }
}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="i-undo"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></g>
    <g id="i-erase"><path d="M20 20H9l-5-5a2 2 0 0 1 0-3l8-8a2 2 0 0 1 3 0l6 6a2 2 0 0 1 0 3l-7 7"/><path d="m8 9 7 7"/></g>
    <g id="i-pencil"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></g>
    <g id="i-bulb"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2Z"/></g>
    <g id="i-pause"><path d="M8 5v14M16 5v14"/></g>
    <g id="i-play"><path d="M7 4v16l13-8Z"/></g>
    <g id="i-stats"><path d="M5 20V10M11 20V4M17 20v-7M22 20H2"/></g>
    <g id="i-book"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/></g>
    <g id="i-gear"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></g>
    <g id="i-close"><path d="M6 6l12 12M18 6 6 18"/></g>
  </defs>
</svg>

<div id="app">
  <header class="top">
    <h1>Sudoku</h1>
    <nav>
      <button id="newgame-top" class="pill">New Game</button>
      <button id="btn-stats" class="icon-btn" aria-label="Statistics"><svg viewBox="0 0 24 24"><use href="#i-stats"/></svg></button>
      <button id="btn-guide" class="icon-btn" aria-label="Technique guide"><svg viewBox="0 0 24 24"><use href="#i-book"/></svg></button>
      <button id="btn-settings" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 24 24"><use href="#i-gear"/></svg></button>
    </nav>
  </header>

  <main class="game">
    <section class="board-col">
      <div class="info">
        <div>Difficulty: <b id="lvl">-</b></div>
        <div id="mist-wrap">Mistakes: <b id="mist">0/3</b></div>
        <div class="time"><b id="time">00:00</b>
          <button id="btn-pause" class="icon-btn small" aria-label="Pause"><svg viewBox="0 0 24 24"><use id="pause-ico" href="#i-pause"/></svg></button>
        </div>
      </div>
      <div class="board-wrap">
        <div id="board" class="board"></div>
        <button id="paused" class="paused" hidden aria-label="Resume"><svg viewBox="0 0 24 24"><use href="#i-play"/></svg><span>Paused</span></button>
      </div>
    </section>

    <section class="side">
      <div id="hint" class="hint" hidden>
        <div class="hint-head">
          <h3 id="hint-title"></h3>
          <span id="hint-dots" class="dots"></span>
          <button id="hint-guide" class="link">What is this?</button>
          <button id="hint-close" class="icon-btn small" aria-label="Close hint"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
        </div>
        <p id="hint-body"></p>
      </div>
      <div id="status" class="status" aria-live="polite"></div>
      <div class="actions">
        <button id="btn-undo" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-undo"/></svg></span>Undo</button>
        <button id="btn-erase" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-erase"/></svg></span>Erase</button>
        <button id="btn-notes" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-pencil"/></svg><span id="notes-badge" class="badge">OFF</span></span>Notes</button>
        <button id="btn-hint" class="act"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-bulb"/></svg></span>Hint</button>
      </div>
      <div id="pad" class="pad"></div>
      <button id="newgame" class="primary desktop-only">New Game</button>
    </section>
  </main>

</div>

<div id="modal" class="modal" hidden><div id="sheet" class="sheet" role="dialog" aria-modal="true"></div></div>

<script>
// Sudoku logic engine. Runs unchanged in Node (tools) and in the browser (app).
// Cells are 0..80 row-major. Candidates are 9-bit masks (bit d-1 set => digit d possible).
// Units: 0-8 rows, 9-17 columns, 18-26 boxes.
(function (root) {
  'use strict';

  const ROW = [], COL = [], BOX = [], UNITS = [], PEERS = [];
  for (let i = 0; i < 81; i++) { ROW[i] = (i / 9) | 0; COL[i] = i % 9; BOX[i] = ((ROW[i] / 3) | 0) * 3 + ((COL[i] / 3) | 0); }
  for (let u = 0; u < 27; u++) UNITS.push([]);
  for (let i = 0; i < 81; i++) { UNITS[ROW[i]].push(i); UNITS[9 + COL[i]].push(i); UNITS[18 + BOX[i]].push(i); }
  const SEES = new Uint8Array(81 * 81);
  for (let i = 0; i < 81; i++) {
    const s = new Set();
    for (const u of [ROW[i], 9 + COL[i], 18 + BOX[i]]) for (const c of UNITS[u]) if (c !== i) s.add(c);
    PEERS[i] = [...s];
    for (const p of PEERS[i]) SEES[i * 81 + p] = 1;
  }
  const sees = (a, b) => SEES[a * 81 + b] === 1;

  const POP = new Uint8Array(512), DIGS = [];
  for (let m = 0; m < 512; m++) { const ds = []; for (let d = 0; d < 9; d++) if (m & (1 << d)) ds.push(d + 1); POP[m] = ds.length; DIGS[m] = ds; }
  const bit = d => 1 << (d - 1);

  // Techniques in the order a solver tries them. `level` is the ladder level that first needs it.
  const TECHS = [
    { id: 'full_house', name: 'Last free cell', level: 1 },
    { id: 'hidden_single_box', name: 'Hidden single', level: 1 },
    { id: 'hidden_single_line', name: 'Hidden single', level: 3 },
    { id: 'naked_single', name: 'Naked single', level: 4 },
    { id: 'pointing', name: 'Pointing pair', level: 5 },
    { id: 'claiming', name: 'Box-line reduction', level: 5 },
    { id: 'naked_pair', name: 'Naked pair', level: 5 },
    { id: 'hidden_pair', name: 'Hidden pair', level: 5 },
    { id: 'naked_triple', name: 'Naked triple', level: 6 },
    { id: 'hidden_triple', name: 'Hidden triple', level: 6 },
    { id: 'x_wing', name: 'X-wing', level: 6 },
    { id: 'skyscraper', name: 'Skyscraper', level: 7 },
    { id: 'two_string_kite', name: '2-string kite', level: 7 },
    { id: 'swordfish', name: 'Swordfish', level: 7 },
    { id: 'turbot_fish', name: 'Turbot fish', level: 7 },
    { id: 'xy_wing', name: 'XY-wing', level: 8 },
    { id: 'xyz_wing', name: 'XYZ-wing', level: 8 },
    { id: 'simple_colouring', name: 'Simple colouring', level: 9 },
    { id: 'unique_rectangle', name: 'Unique rectangle', level: 9 },
    { id: 'x_chain', name: 'X-chain', level: 10 },
    { id: 'xy_chain', name: 'XY-chain', level: 10 },
  ];
  const TI = {}; TECHS.forEach((t, i) => { TI[t.id] = i; });

  const unitName = u => u < 9 ? 'row ' + (u + 1) : u < 18 ? 'column ' + (u - 8) : 'box ' + (u - 17);
  const cellName = i => 'row ' + (ROW[i] + 1) + ', column ' + (COL[i] + 1);
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

    closeModal(); save(); render();
  }
  function afterPlace(cell, r, keepHint) {
    changed(keepHint);
    if (r.erased) { A.play('erase'); return; }
    if (r.wrong) {
      A.play('error'); anim(cell, 'shake');
      if (g.mistakes === G.MISTAKE_LIMIT) { say('3 mistakes: this game counts as a fail. You can keep playing.'); render(); }
      return;
    }
    anim(cell, 'pop');
    if (r.win) { finish(cell); return; }
    if (r.units.length) { A.play('unit'); for (const u of r.units) ripple(E.UNITS[u], cell); if (r.digitDone) setTimeout(() => A.play('digit'), 320); }
    else A.play(r.digitDone ? 'digit' : 'place');
  }
  function finish(cell) {
    const st = G.status(g), stats = S.record(g.level, st, g.elapsed, g.hints);
    sel = -1; lock = 0; save(); render();
    A.play('win'); ripple([...Array(81).keys()], cell);
    setTimeout(() => showResult(st, stats), 1300);
  }
  function enter(cell, d) {
    if (!g || g.done || paused || G.isLocked(g, cell)) { render(); return; }
    if (notesMode) { if (G.toggleNote(g, cell, d).changed) { A.play('note'); changed(); } return; }
    const r = G.place(g, cell, d);
    if (r.changed) afterPlace(cell, r); else render();
  }
  function tapCell(i) {
    if (!g || paused) return;
    sel = i;
    if (lock && !g.done) enter(i, lock); else render();
  }
  function setLock(d) {
    if (!g || g.done || G.remaining(g, d) === 0) return;
    lock = d; A.play('lock'); render();
  }
  function tapNum(d) {
    if (!g || g.done || paused) return;
    if (lock) { lock = lock === d ? 0 : (G.remaining(g, d) ? d : lock); render(); return; }
    if (sel >= 0) enter(sel, d);
  }
  function doErase() { if (g && sel >= 0 && !paused && G.erase(g, sel)) { A.play('erase'); changed(); } }
  function doUndo() { if (g && !paused && G.undo(g)) { A.play('undo'); changed(); } }
  function toggleNotes() { notesMode = !notesMode; A.play('note'); render(); }
  function togglePause() { if (!g || g.done) return; paused = !paused; lastTick = Date.now(); save(); render(); }
  function doHint() {
    if (!g || g.done || paused) return;
    if (hint && hint.rev === g.rev && hint.stage < hint.max) hint.stage++;
    else { hint = H.compute(g); if (hint.kind === 'step' || hint.kind === 'stuck') g.hints++; }
    A.play('hint');
    const reveal = (hint.kind === 'step' && hint.stage === 4) || (hint.kind === 'stuck' && hint.stage === 2);
    if (!reveal) { save(); render(); return; }
    const h = hint, cell = h.kind === 'stuck' ? h.cells[0] : h.step.place ? h.step.place.cell : -1;
    const r = H.apply(g, h);
    h.rev = g.rev; // keep the card up to say what was done
    if (r && r.changed) afterPlace(cell, r, true); else changed(true);
  }

  // ---------- sheets
  const head = title => '<div class="sheet-head"><h2>' + title + '</h2><button class="icon-btn" data-act="close" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button></div>';
  function openModal(html) { $('sheet').innerHTML = html; $('sheet').scrollTop = 0; $('modal').hidden = false; }
  function closeModal() { $('modal').hidden = true; $('sheet').textContent = ''; lastTick = Date.now(); }

  function showLevels() {
    const stats = S.loadStats(); let rows = '';
    for (let l = 1; l <= 10; l++) {
      const s = stats[l], avg = S.average(s);
      rows += '<button class="level' + (g && !g.done && g.level === l ? ' current' : '') + '" data-act="start" data-arg="' + l + '"><span class="n">' + l + '</span>' +
        '<span><div class="name">' + E.LEVEL_NAMES[l] + '</div><div class="sub">' + LEVEL_SUB[l] + '</div></span>' +
        '<span class="avg">' + (avg ? 'avg ' + fmt(avg) + '<br>' + s.pass + ' passed' : '') + '</span></button>';
    }
    openModal(head('New game') + '<div class="levels">' + rows + '</div>' +
      (g && !g.done ? '<button class="secondary" data-act="restart">Restart this puzzle</button>' : ''));
  }
  function showResult(st, s) {
    const label = { pass: 'Passed', fail: 'Failed: 3 or more mistakes', assisted: 'Assisted' }[st];
    const why = st === 'fail' ? 'Three or more mistakes, so this time is left out of your average.'
      : st === 'assisted' ? 'A step was applied for you, so this time is left out of your average.' : '';
    openModal(head('Solved') + '<div class="result"><span class="tag ' + st + '">' + label + '</span><div class="big">' + fmt(g.elapsed) + '</div>' +
      '<div class="sub">Level ' + g.level + ' · ' + E.LEVEL_NAMES[g.level] + '</div></div>' +
      '<div class="facts"><div class="fact">Mistakes<b>' + g.mistakes + '</b></div><div class="fact">Hints<b>' + g.hints + '</b></div>' +
      '<div class="fact">Best at this level<b>' + (s.best ? fmt(s.best) : '–') + '</b></div><div class="fact">Average at this level<b>' + (s.pass ? fmt(S.average(s)) : '–') + '</b></div></div>' +
      (why ? '<p class="note-line">' + why + '</p>' : '') +
      '<button class="primary" data-act="start" data-arg="' + g.level + '">New game, same level</button><div class="gap"></div>' +
      '<button class="secondary" data-act="levels">Change level</button>');
  }
  function showStats() {
    const stats = S.loadStats(); let rows = '';
    for (let l = 1; l <= 10; l++) {
      const s = stats[l];
      rows += '<tr><td>' + l + ' ' + E.LEVEL_NAMES[l] + '</td><td>' + s.played + '</td><td>' + s.pass + '</td><td>' + s.fail + '</td><td>' + s.assisted + '</td><td>' +
        (s.best ? fmt(s.best) : '–') + '</td><td>' + (s.pass ? fmt(S.average(s)) : '–') + '</td></tr>';
    }
    openModal(head('Statistics') + '<table class="stats"><tr><th>Level</th><th>Played</th><th>Pass</th><th>Fail</th><th>Asst.</th><th>Best</th><th>Avg</th></tr>' + rows + '</table>' +
      '<p class="note-line">Best and average count only passes: fewer than 3 mistakes and no step applied by a hint. Stats are stored on this device.</p>');
  }
  function showSettings() {
    const seg = ['auto', 'light', 'dark'].map(t => '<button data-act="theme" data-arg="' + t + '" class="' + (settings.theme === t ? 'on' : '') + '">' + t[0].toUpperCase() + t.slice(1) + '</button>').join('');
    const sw = (key, on) => '<button class="switch' + (on ? ' on' : '') + '" data-act="toggle" data-arg="' + key + '" role="switch" aria-checked="' + on + '"></button>';
    openModal(head('Settings') +
      '<div class="setting">Theme<span class="seg">' + seg + '</span></div>' +
      '<div class="setting">Sound' + sw('sound', settings.sound) + '</div>' +
      (A.canVibrate ? '<div class="setting">Vibration' + sw('vibrate', settings.vibrate) + '</div>' : '') +
      '<p class="note-line">On iPhone, sound follows the ring/silent switch, and web pages cannot vibrate.</p>' +
      '<button class="secondary" data-act="reset">Reset statistics</button>');
  }
  function showGuide() {
    let html = head('Technique guide'), level = 0;
    for (const t of GUIDE) {
      if (t.level !== level) { level = t.level; html += '<div class="guide-group">Level ' + level + ' · ' + E.LEVEL_NAMES[level] + '</div>'; }
      html += '<button class="guide-item" data-act="technique" data-arg="' + t.id + '">' + t.name + '</button>';
    }
    openModal(html);
  }
  function showTechnique(id) {
    const t = GUIDE.find(x => x.id === id || (x.alias && x.alias.includes(id))); if (!t) return;
    const ex = EXAMPLES[t.id];
    openModal(head(t.name) + '<div id="example" class="mini"></div><p class="caption">' + ex.where + '. ' +
      (ex.place ? 'The green cell must be ' + ex.place[1] + '.' : 'Green cells form the pattern; red candidates are removed.') + '</p>' +
      '<p class="guide-text">' + t.text + '</p><button class="secondary" data-act="guide">All techniques</button>');
    const board = document.createElement('div'); board.className = 'board'; $('example').appendChild(board);
    const cs = buildBoard(board), show = flags(ex.show), strike = new Int16Array(81);
    for (const [cell, d] of ex.elims) { strike[cell] |= E.bit(d); cs[cell].el.classList.add('ht'); }
    for (const i of ex.cells) cs[i].el.classList.add('hp');
    for (let i = 0; i < 81; i++) {
      const v = +ex.vals[i]; if (v) { cs[i].val.textContent = v; continue; }
      const mask = ex.digit ? (ex.cand[i] & E.bit(ex.digit)) : (show[i] ? ex.cand[i] : 0);
      for (let d = 1; d <= 9; d++) if (mask & E.bit(d)) cs[i].marks[d - 1].className = (strike[i] & E.bit(d)) ? 'strike' : 'on';
    }
  }

  function applyTheme() {
    const dark = settings.theme === 'dark' || (settings.theme === 'auto' && self.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = dark ? '#101820' : '#ffffff';
  }
  function applySettings() { A.enabled = settings.sound; A.vibrate = settings.vibrate; applyTheme(); }

  const ACTIONS = {
    close: closeModal, levels: showLevels, guide: showGuide, technique: showTechnique, restart,
    start: l => start(+l),
    theme: t => { settings.theme = t; S.saveSettings(settings); applySettings(); showSettings(); },
    toggle: k => { settings[k] = !settings[k]; S.saveSettings(settings); applySettings(); showSettings(); if (settings[k]) A.play('place'); },
    reset: () => { if (confirm('Reset all statistics? This cannot be undone.')) { S.resetStats(); showSettings(); } },
  };

  // ---------- events
  document.addEventListener('pointerdown', () => A.unlock(), { passive: true });
  $('board').addEventListener('pointerdown', e => { const c = e.target.closest('.cell'); if (c) tapCell(+c.dataset.i); });

  let press = null; // pad: a short tap enters the digit, a long press locks it
  $('pad').addEventListener('pointerdown', e => {
    const b = e.target.closest('.num'); if (!b) return;
    const d = +b.dataset.d;
    press = { d, long: false, timer: setTimeout(() => { if (press) { press.long = true; setLock(d); } }, LONG_PRESS_MS) };
  });
  const release = e => {
    if (!press) return;
    clearTimeout(press.timer);
    const p = press; press = null;
    if (e.type === 'pointerup' && !p.long) tapNum(p.d);
  };
  for (const type of ['pointerup', 'pointercancel', 'pointerleave']) $('pad').addEventListener(type, release);
  $('pad').addEventListener('contextmenu', e => e.preventDefault());

  $('btn-undo').addEventListener('click', doUndo);
  $('btn-erase').addEventListener('click', doErase);
  $('btn-notes').addEventListener('click', toggleNotes);
  $('btn-hint').addEventListener('click', doHint);
  $('btn-pause').addEventListener('click', togglePause);
  $('paused').addEventListener('click', togglePause);
  $('newgame').addEventListener('click', showLevels);
  $('newgame-top').addEventListener('click', showLevels);
  $('btn-stats').addEventListener('click', showStats);
  $('btn-guide').addEventListener('click', showGuide);
  $('btn-settings').addEventListener('click', showSettings);
  $('hint-close').addEventListener('click', () => { hint = null; render(); });
  $('hint-guide').addEventListener('click', () => { if (hint && hint.step) showTechnique(hint.step.tech.id); });
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  $('sheet').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && ACTIONS[b.dataset.act]) ACTIONS[b.dataset.act](b.dataset.arg); });

  document.addEventListener('keydown', e => {
    if (!$('modal').hidden) { if (e.key === 'Escape') closeModal(); return; }
    const digit = /^(Digit|Numpad)[1-9]$/.test(e.code) ? +e.code.slice(-1) : 0;
    if (digit) {
      if (!g || g.done || paused || sel < 0) return;
      if (e.shiftKey !== notesMode) { if (!G.isLocked(g, sel) && G.toggleNote(g, sel, digit).changed) { A.play('note'); changed(); } } // Shift flips the mode for one key
      else { const r = G.place(g, sel, digit); if (r.changed) afterPlace(sel, r); }
      e.preventDefault(); return;
    }
    const move = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (move) {
      const from = sel < 0 ? 40 : sel, to = from + move;
      if (to >= 0 && to < 81 && (Math.abs(move) === 9 || E.ROW[to] === E.ROW[from])) sel = to; else if (sel < 0) sel = 40;
      render(); e.preventDefault(); return;
    }
    const k = e.key.toLowerCase();
    if (k === 'backspace' || k === 'delete' || k === '0') doErase();
    else if (k === 'n') toggleNotes();
    else if (k === 'u' || (k === 'z' && (e.ctrlKey || e.metaKey))) doUndo();
    else if (k === 'h') doHint();
    else if (k === 'p' || k === ' ') togglePause();
    else if (k === 'escape') { hint = null; lock = 0; render(); }
    else return;
    e.preventDefault();
  });

  // The clock runs only while the puzzle is actually on screen.
  const ticking = () => g && !g.done && !paused && !document.hidden && $('modal').hidden;
  setInterval(() => {
    const now = Date.now();
    if (ticking()) {
      g.elapsed += Math.min(now - lastTick, 1000);
      $('time').textContent = fmt(g.elapsed);
      if (now - lastSave > 5000) save();
    }
    lastTick = now;
  }, 250);
  document.addEventListener('visibilitychange', () => { lastTick = Date.now(); if (document.hidden) save(); });
  self.addEventListener('pagehide', save);
  if (self.matchMedia) { const mq = matchMedia('(prefers-color-scheme: dark)'); if (mq.addEventListener) mq.addEventListener('change', applyTheme); }

  // ---------- start up
  applySettings();
  const saved = G.deserialize(S.loadGame());
  if (saved && !saved.done) g = saved;
  render();
  if (!g) showLevels();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();

</script>
</body>
</html>
